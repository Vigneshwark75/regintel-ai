[project]
name = "regintel-ui"
version = "0.1.0"
description = "RegIntel AI — Streamlit compliance UI."
requires-python = ">=3.11"
dependencies = [
    "regintel-shared",
    "streamlit>=1.39.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
regintel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]

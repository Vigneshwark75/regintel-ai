[project]
name = "regintel-api"
version = "0.1.0"
description = "RegIntel AI — FastAPI HTTP layer."
requires-python = ">=3.11"
dependencies = [
    "regintel-domain",
    "regintel-application",
    "regintel-infrastructure",
    "regintel-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
regintel-domain = { workspace = true }
regintel-application = { workspace = true }
regintel-infrastructure = { workspace = true }
regintel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

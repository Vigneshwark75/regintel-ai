[project]
name = "regintel-ai"
version = "0.1.0"
description = "RegIntel AI — Enterprise Regulatory Intelligence Platform (Agentic RAG)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
]

# This root pyproject.toml is a workspace root only — it defines shared tool
# configuration and dev tooling, and is never itself built/installed as a package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
regintel-domain = { workspace = true }
regintel-application = { workspace = true }
regintel-infrastructure = { workspace = true }
regintel-shared = { workspace = true }

# --------------------------------------------------------------------------
# Ruff — linting + import sorting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated migration files are semi-generated boilerplate we don't hand-author.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "regintel_domain",
    "regintel_application",
    "regintel_infrastructure",
    "regintel_shared",
]

# --------------------------------------------------------------------------
# Black
# --------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --------------------------------------------------------------------------
# Mypy — strict on our own code
# --------------------------------------------------------------------------
[tool.mypy]
# Matches the interpreter we develop against (3.12). requires-python stays >=3.11 as
# the support floor; numpy's stubs (pulled in transitively via streamlit -> pandas)
# use 3.12-only syntax that fails to parse under a lower python_version.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "migrations/versions"]

# nemoguardrails ships no py.typed marker / stubs. We only touch its public
# RailsConfig/LLMRails/GenerationOptions API in one adapter module; ignoring
# missing imports there is narrower than disabling strictness project-wide.
[[tool.mypy.overrides]]
module = "nemoguardrails.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires docker compose infra (Postgres/Qdrant) running via `make infra-up`",
]

services:
  postgres:
    image: postgres:16-alpine
    container_name: regintel-postgres
    environment:
      POSTGRES_USER: regintel
      POSTGRES_PASSWORD: regintel
      POSTGRES_DB: regintel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: regintel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:

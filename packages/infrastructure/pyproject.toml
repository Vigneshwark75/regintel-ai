[project]
name = "regintel-infrastructure"
version = "0.1.0"
description = "RegIntel AI — infrastructure layer: adapters implementing application ports (Postgres, Qdrant, LLM providers, parsers)."
requires-python = ">=3.11"
dependencies = [
    "regintel-domain",
    "regintel-application",
    "regintel-shared",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "qdrant-client>=1.12.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openai>=1.54.0",
    "fastembed>=0.4.2",
]

[tool.uv.sources]
regintel-domain = { workspace = true }
regintel-application = { workspace = true }
regintel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel_infrastructure"]

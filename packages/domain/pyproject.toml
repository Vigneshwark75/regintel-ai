[project]
name = "regintel-domain"
version = "0.1.0"
description = "RegIntel AI — domain layer: entities, value objects, domain services. No I/O, no framework deps."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel_domain"]

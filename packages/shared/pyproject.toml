[project]
name = "regintel-shared"
version = "0.1.0"
description = "RegIntel AI — shared kernel: settings, logging, exceptions. No dependency on other internal packages."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel_shared"]
